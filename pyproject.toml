[project]
name = "s3-optimized-client"
version = "0.1.0"
description = "Fast parallel S3-compatible object storage downloader with per-IP TCP connections"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "platform-eng" }]
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "urllib3>=2.0",
    "rich>=13.7",
]

[project.scripts]
s3-optimized-client = "s3_optimized_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_optimized_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
